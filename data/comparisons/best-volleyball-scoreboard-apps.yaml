criteriaHeading: What Makes a Good Scoreboard App?
criteria:
  - title: Readable Across the Gym
    body: >-
      A scoreboard nobody can read from the back row is a phone with numbers on
      it. Big type, high contrast, and a display that survives daylight.
  - title: Spectators Without Installs
    body: >-
      Parents will not download an app to check a score. A link that opens in any
      browser reaches everyone; an app-store listing reaches almost nobody.
  - title: Stream and TV Output
    body: >-
      Casting to a gym TV or dropping a live overlay into OBS, vMix, or
      Streamlabs turns the scoreboard into part of the broadcast.
  - title: Survives a Dead Connection
    body: >-
      Gym wifi fails. A scoreboard that stops when the connection drops is worse
      than a flip chart, which at least keeps working.
  - title: Knows the Rules
    body: >-
      Most scoreboards count taps. A few understand rotation, substitutions, and
      the libero, and refuse to record something illegal.
  - title: Leaves a Record
    body: >-
      Some matches need a scoresheet afterwards. Whether the app can produce one
      decides if you also keep paper.

